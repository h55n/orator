services:

  # PostgreSQL matches the backend JDBC driver and Hibernate dialect.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: interviewgen_db
      POSTGRES_USER: orator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a private database password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orator -d interviewgen_db"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # ── Spring Boot Backend ───────────────────────────────────────
  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:7860"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/interviewgen_db
      SPRING_DATASOURCE_USERNAME: orator
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a private database password}
      AI_PROVIDER: groq
      AI_GROQ_API_KEY: ${GROQ_API_KEY:-}
      AI_GROQ_BASE_URL: https://api.groq.com/openai/v1
      AI_GROQ_MODEL: llama-3.3-70b-versatile
      AI_GROQ_MAX_TOKENS: "4096"
      AI_GROQ_TEMPERATURE: "0.7"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a private Base64-encoded key of at least 32 bytes}
      JWT_EXPIRATION_MS: "86400000"
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
