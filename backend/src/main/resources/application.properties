# ============================================================
# Orator — Application Configuration
# ============================================================

spring.application.name=orator

# ── Database ─────────────────────────────────────────────────
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/interviewgen_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ──────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ── JWT ──────────────────────────────────────────────────────
# 256-bit Base64-encoded secret (generated — do NOT commit to public repos)
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# ── AI Provider (pick ONE, set the other blank) ───────────────
#
# OPTION A: GROQ (free, fast — https://console.groq.com)
# Models: llama3-70b-8192 | mixtral-8x7b-32768 | gemma2-9b-it
ai.provider=groq
ai.groq.api-key=${GROQ_API_KEY:}
ai.groq.base-url=https://api.groq.com/openai/v1
ai.groq.model=llama-3.3-70b-versatile
ai.groq.max-tokens=4096
ai.groq.temperature=0.7

# OPTION B: NVIDIA NIM (free credits — https://build.nvidia.com)
# Models: meta/llama-3.1-70b-instruct | mistralai/mistral-7b-instruct-v0.3
#ai.provider=nvidia
#ai.nvidia.api-key=YOUR_NVIDIA_API_KEY_HERE
#ai.nvidia.base-url=https://integrate.api.nvidia.com/v1
#ai.nvidia.model=meta/llama-3.1-70b-instruct
#ai.nvidia.max-tokens=4096
#ai.nvidia.temperature=0.7

# ── NVIDIA fallback defaults (required even when using GROQ) ──
ai.nvidia.api-key=
ai.nvidia.base-url=https://integrate.api.nvidia.com/v1
ai.nvidia.model=meta/llama-3.1-70b-instruct
ai.nvidia.max-tokens=4096
ai.nvidia.temperature=0.7

# ── Server ───────────────────────────────────────────────────
server.port=7860
server.error.include-message=always
server.error.include-binding-errors=always

# ── CORS ─────────────────────────────────────────────────────
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# ── Logging ──────────────────────────────────────────────────
logging.level.com.nexoraa=DEBUG
logging.level.org.springframework.security=WARN
